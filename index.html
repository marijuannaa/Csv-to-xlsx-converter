<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Karakter Dönüştürücü</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; line-height: 1.6; text-align: center; }
        .box { border: 2px dashed #ccc; padding: 30px; border-radius: 10px; background: #fafafa; cursor: pointer; }
        .btn { display: inline-block; background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; margin-top: 20px; font-weight: bold; }
        .btn:hover { background: #0056b3; }
        #downloadArea { display: none; margin-top: 20px; }
    </style>
</head>
<body>

    <h2>CSV Karakter Dönüştürücü</h2>
    <p>Dosyanızdaki <b>;</b> karakterlerini <b>,</b> karakterine; <b>,</b> karakterlerini ise <b>.</b> karakterine dönüştürür.</p>

    <div class="box" onclick="document.getElementById('fileInput').click()">
        <p>CSV dosyasını seçmek için buraya tıklayın</p>
        <input type="file" id="fileInput" accept=".csv,.txt" style="display:none">
    </div>

    <div id="downloadArea">
        <p>✅ Dosyanız başarıyla dönüştürüldü!</p>
        <a id="downloadBtn" class="btn" download="donusturulmus_dosya.csv">Yeni CSV Dosyasını İndir</a>
    </div>

    <script>
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                let content = event.target.result;

                // Dönüşüm Mantığı: 
                // Önce geçici bir sembole (örn: [TEMP_COMMA]) virgülleri aktarıyoruz ki karışmasınlar.
                // Sonra ; karakterlerini , yapıyoruz.
                // En son geçici semboldeki eski virgülleri . yapıyoruz.
                content = content.replace(/,/g, '[TEMP_COMMA]');
                content = content.replace(/;/g, ',');
                content = content.replace(/\[TEMP_COMMA\]/g, '.');

                // İndirme butonunu hazırlama
                const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const downloadBtn = document.getElementById('downloadBtn');
                
                downloadBtn.href = url;
                downloadBtn.download = "donusturulmus_" + file.name;
                
                document.getElementById('downloadArea').style.display = 'block';
            };
            reader.readAsText(file);
        });
    </script>

</body>
</html>
