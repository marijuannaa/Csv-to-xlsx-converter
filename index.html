<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gelişmiş Çoklu CSV Dönüştürücü</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 50px auto; padding: 20px; line-height: 1.6; text-align: center; color: #333; }
        .box { border: 2px dashed #007bff; padding: 30px; border-radius: 10px; background: #fafafa; cursor: pointer; transition: 0.2s; }
        .box:hover { background: #f0f7ff; }
        
        /* Kavisli Kare Dosya Kartları Alanı */
        .file-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 25px; }
        .file-card { background: #ffffff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 15px; width: 120px; height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); animation: fadeIn 0.3s ease; }
        .file-icon { font-size: 24px; margin-bottom: 5px; }
        .file-name { font-size: 11px; font-weight: bold; word-break: break-all; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
        
        .btn { display: inline-block; background: #28a745; color: white; padding: 12px 30px; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; margin-top: 25px; font-weight: bold; font-size: 16px; box-shadow: 0 4px 6px rgba(40,167,69,0.2); display: none; }
        .btn:hover { background: #218838; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <h2>Çoklu CSV Dönüştürücü</h2>
    <p>Bilimsel sayı biçimlerini sütun düzenini tamamen koruyarak düzeltir.<br>
    Ardından <b>;</b> karakterlerini <b>,</b>; eski <b>,</b> karakterlerini ise <b>.</b> formatına çevirir.</p>

    <div class="box" onclick="document.getElementById('fileInput').click()">
        <p>CSV dosyalarını seçmek için tıklayın<br><small style="color: #666;">(Birden fazla dosya seçebilirsiniz)</small></p>
        <input type="file" id="fileInput" accept=".csv,.txt" multiple style="display:none">
    </div>

    <div class="file-list" id="fileList"></div>
    <button id="downloadAllBtn" class="btn">Hepsini İndir</button>

    <script>
        let processedFiles = [];

        // Hücre içindeki e+ veya e- formatlı sayıları hassas şekilde çözen fonksiyon
        function convertScientificCell(cellValue) {
            let trimmed = cellValue.trim();
            // Tam bilimsel sayı formatı kontrolü
            if (/^[-+]?[0-9]*\.?[0-9]+[eE][-+]?[0-9]+$/.test(trimmed)) {
                let num = Number(trimmed);
                if (!isNaN(num) && isFinite(num)) {
                    let parts = trimmed.toLowerCase().split('e');
                    let exponent = parseInt(parts[1], 10);
                    
                    let decimalPlaces = 0;
                    if (parts[0].includes('.')) {
                        decimalPlaces = parts[0].split('.')[1].length;
                    }
                    
                    // Küsurat kayıplarını ve hayali sayı türemelerini engelleyen yuvarlama basamağı
                    let targetPrecision = Math.max(0, decimalPlaces - exponent);
                    let fixedNum = num.toFixed(targetPrecision);
                    
                    // Orijinalinde sıfır varsa (Örn: 8.305560) sondaki sıfır korunsun diye kontrol
                    // Eğer ondalık hane hedef değerden kısaysa sonuna eksik sıfırları tamamlar
                    if (fixedNum.indexOf('.') !== -1 && targetPrecision > 0) {
                        let currentDecimals = fixedNum.split('.')[1].length;
                        if (currentDecimals < targetPrecision) {
                            fixedNum = fixedNum.padEnd(fixedNum.length + (targetPrecision - currentDecimals), '0');
                        }
                    }
                    return fixedNum;
                }
            }
            return cellValue;
        }

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const files = e.target.files;
            if (files.length === 0) return;

            const fileListContainer = document.getElementById('fileList');
            const downloadAllBtn = document.getElementById('downloadAllBtn');
            
            fileListContainer.innerHTML = "";
            processedFiles = [];

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                
                reader.onload = function(event) {
                    let rawContent = event.target.result;
                    let lines = rawContent.split(/\r?\n/);
                    let processedLines = [];

                    for (let i = 0; i < lines.length; i++) {
                        let currentLine = lines[i];
                        if (currentLine.trim() === "") {
                            processedLines.push("");
                            continue;
                        }

                        // Sütun ayırıcıyı dinamik tespit ediyoruz: Sekme(\t), Noktali Virgül(;) veya Virgül(,)
                        let delimiter = ",";
                        if (currentLine.includes('\t')) {
                            delimiter = "\t";
                        } else if (currentLine.includes(';')) {
                            delimiter = ";";
                        }

                        // Satırı sütunlarına parçalıyoruz
                        let columns = currentLine.split(delimiter);

                        // Sadece hücre bazlı sayı dönüşümü yapıyoruz, ayırıcılara dokunmuyoruz
                        let processedColumns = columns.map(cell => convertScientificCell(cell));

                        // Sütunları kendi orijinal ayırıcısıyla (Örn: Tab ise Tab ile) birleştiriyoruz
                        let mergedLine = processedColumns.join(delimiter);

                        // Karakter dönüşümlerini sütunlar birleştikten sonra GÜVENLİ alanlarda uyguluyoruz
                        if (delimiter === ";") {
                            // Eğer ayırıcı ; ise, hücre içindeki eski virgülleri nokta yapıp ana ayırıcıyı virgül yapıyoruz
                            mergedLine = mergedLine.replace(/,/g, '.');
                            mergedLine = mergedLine.replace(/;/g, ',');
                        } else if (delimiter === "\t") {
                            // Eğer ayırıcı Sekme (Tab) ise, Excel'in virgülle ayırması için sekmeleri virgüle çeviriyoruz
                            mergedLine = mergedLine.replace(/,/g, '.');
                            mergedLine = mergedLine.replace(/\t/g, ',');
                        } else {
                            // Standart virgüllü yapılarda çakışmayı önleme
                            mergedLine = mergedLine.replace(/,/g, '[TEMP_COMMA]');
                            mergedLine = mergedLine.replace(/\[TEMP_COMMA\]/g, '.');
                        }

                        processedLines.push(mergedLine);
                    }

                    let content = processedLines.join('\n');

                    // Dosyayı oluşturma ve listeye ekleme
                    const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    processedFiles.push({ url: url, name: "donusturulmus_" + file.name });

                    // Görsel Kart Ekleme
                    const card = document.createElement('div');
                    card.className = 'file-card';
                    card.innerHTML = `
                        <div class="file-icon">📄</div>
                        <div class="file-name" title="${file.name}">${file.name}</div>
                    `;
                    fileListContainer.appendChild(card);

                    if (processedFiles.length > 0) {
                        downloadAllBtn.style.display = 'inline-block';
                    }
                };
                
                reader.readAsText(file);
            });
        });

        // Hepsini İndir Tetikleyicisi
        document.getElementById('downloadAllBtn').addEventListener('click', function() {
            processedFiles.forEach((fileInfo, index) => {
                setTimeout(() => {
                    const a = document.createElement('a');
                    a.href = fileInfo.url;
                    a.download = fileInfo.name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                }, index * 250);
            });
        });
    </script>

</body>
</html>
