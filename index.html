<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çoklu CSV Dönüştürücü</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 50px auto; padding: 20px; line-height: 1.6; text-align: center; color: #333; }
        .box { border: 2px dashed #007bff; padding: 30px; border-radius: 10px; background: #fafafa; cursor: pointer; transition: 0.2s; }
        .box:hover { background: #f0f7ff; }
        
        /* Kavisli Kare Dosya Kartları Alanı */
        .file-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 25px; }
        .file-card { background: #ffffff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 15px; width: 120px; height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); animation: fadeIn 0.3s ease; }
        .file-icon { font-size: 24px; margin-bottom: 5px; }
        .file-name { font-size: 11px; font-weight: bold; word-break: break-all; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
        
        .btn { display: inline-block; background: #28a745; color: white; padding: 12px 30px; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; margin-top: 25px; font-weight: bold; font-size: 16px; box-shadow: 0 4px 6px rgba(40,167,69,0.2); display: none; }
        .btn:hover { background: #218838; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <h2>Çoklu CSV Dönüştürücü</h2>
    <p>Bilimsel sayıları (e+002) düzeltir ve sütunları (A ve B) birbirinden ayırır.<br>
    İçerideki <b>;</b> karakterlerini <b>,</b> yapar; <b>,</b> karakterlerini ise <b>.</b> yapar.</p>

    <div class="box" onclick="document.getElementById('fileInput').click()">
        <p>CSV dosyalarını seçmek için tıklayın<br><small style="color: #666;">(Birden fazla dosya seçebilirsiniz)</small></p>
        <input type="file" id="fileInput" accept=".csv,.txt" multiple style="display:none">
    </div>

    <div class="file-list" id="fileList"></div>
    <button id="downloadAllBtn" class="btn">Hepsini İndir</button>

    <script>
        let processedFiles = [];

        // Hücre içindeki bilimsel sayıları ondalık kısımlarını bozmadan çözen fonksiyon
        function processCell(cellValue) {
            let trimmed = cellValue.trim();
            
            // Eğer hücre tam bir bilimsel sayı formatındaysa (Örn: 5.992711e+002)
            if (/^[-+]?[0-9]*\.?[0-9]+[eE][-+]?[0-9]+$/.test(trimmed)) {
                let num = Number(trimmed);
                if (!isNaN(num) && isFinite(num)) {
                    let parts = trimmed.toLowerCase().split('e');
                    let exponent = parseInt(parts[1], 10);
                    
                    // Ondalık hane sayısını doğru bulmak için noktadan sonrasını alıyoruz
                    let decimalPlaces = 0;
                    if (parts[0].includes('.')) {
                        decimalPlaces = parts[0].split('.')[1].length;
                    }
                    
                    // Ondalık kısmın silinmesini engelleyen net hedef basamak hesabı
                    let targetPrecision = Math.max(0, decimalPlaces - exponent);
                    let fixedNum = num.toFixed(targetPrecision);
                    
                    // Eğer sayı ondalıklıysa ve eksik sıfır varsa sonuna tamamlar (8.305560 koruması)
                    if (fixedNum.indexOf('.') !== -1 && targetPrecision > 0) {
                        let currentDecimals = fixedNum.split('.')[1].length;
                        if (currentDecimals < targetPrecision) {
                            fixedNum = fixedNum.padEnd(fixedNum.length + (targetPrecision - currentDecimals), '0');
                        }
                    }
                    trimmed = fixedNum;
                }
            }
            
            // Sizin istediğiniz karakter dönüşüm kuralları:
            trimmed = trimmed.replace(/,/g, '.');
            trimmed = trimmed.replace(/;/g, ',');
            
            return trimmed;
        }

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const files = e.target.files;
            if (files.length === 0) return;

            const fileListContainer = document.getElementById('fileList');
            const downloadAllBtn = document.getElementById('downloadAllBtn');
            
            fileListContainer.innerHTML = "";
            processedFiles = [];

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                
                reader.onload = function(event) {
                    let rawContent = event.target.result;
                    let lines = rawContent.split(/\r?\n/);
                    
                    // Orijinal dosyanın ayırıcısını (Delimiter) tespit etme
                    let sample = lines.slice(0, 5).join('\n');
                    let detectedDelimiter = ","; 
                    
                    if ((sample.split('\t').length - 1) > (sample.split(';').length - 1) && (sample.split('\t').length - 1) > (sample.split(',').length - 1)) {
                        detectedDelimiter = "\t"; 
                    } else if ((sample.split(';').length - 1) > (sample.split(',').length - 1)) {
                        detectedDelimiter = ";"; 
                    }

                    let processedLines = [];

                    // Satır satır ve sütun sütun işleme
                    for (let i = 0; i < lines.length; i++) {
                        let currentLine = lines[i];
                        if (currentLine.trim() === "") continue;

                        let columns = currentLine.split(detectedDelimiter);
                        let processedColumns = columns.map(cell => processCell(cell));

                        // Sütunların arasına yapışma olmasın diye yeni standart CSV ayırıcısı olan virgülü koyuyoruz
                        processedLines.push(processedColumns.join(','));
                    }

                    let content = processedLines.join('\n');

                    // Bozuk karakterlere yol açan tüm eklemeleri kaldırdık, saf metin olarak kaydediyoruz
                    const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    processedFiles.push({ url: url, name: "donusturulmus_" + file.name });

                    // Görsel Kart
                    const card = document.createElement('div');
                    card.className = 'file-card';
                    card.innerHTML = `
                        <div class="file-icon">📄</div>
                        <div class="file-name" title="${file.name}">${file.name}</div>
                    `;
                    fileListContainer.appendChild(card);

                    if (processedFiles.length > 0) {
                        downloadAllBtn.style.display = 'inline-block';
                    }
                };
                
                reader.readAsText(file);
            });
        });

        document.getElementById('downloadAllBtn').addEventListener('click', function() {
            processedFiles.forEach((fileInfo, index) => {
                setTimeout(() => {
                    const a = document.createElement('a');
                    a.href = fileInfo.url;
                    a.download = fileInfo.name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                }, index * 250);
            });
        });
    </script>

</body>
</html>
