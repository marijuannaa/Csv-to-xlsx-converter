<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çoklu CSV Dönüştürücü (Sütun Korumalı)</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 50px auto; padding: 20px; line-height: 1.6; text-align: center; color: #333; }
        .box { border: 2px dashed #007bff; padding: 30px; border-radius: 10px; background: #fafafa; cursor: pointer; transition: 0.2s; }
        .box:hover { background: #f0f7ff; }
        
        /* Kavisli Kare Dosya Kartları Alanı */
        .file-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 25px; }
        .file-card { background: #ffffff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 15px; width: 120px; height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); animation: fadeIn 0.3s ease; }
        .file-icon { font-size: 24px; margin-bottom: 5px; }
        .file-name { font-size: 11px; font-weight: bold; word-break: break-all; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
        
        .btn { display: inline-block; background: #28a745; color: white; padding: 12px 30px; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; margin-top: 25px; font-weight: bold; font-size: 16px; box-shadow: 0 4px 6px rgba(40,167,69,0.2); display: none; }
        .btn:hover { background: #218838; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <h2>Çoklu CSV Dönüştürücü</h2>
    <p>Dosyalarınızdaki <b>;</b> karakterlerini <b>,</b>; eski <b>,</b> karakterlerini ise <b>.</b> yapar.<br>
    Sütun düzenini bozmadan <b>bilimsel sayıları</b> normal formata getirir.</p>

    <div class="box" onclick="document.getElementById('fileInput').click()">
        <p>CSV dosyalarını seçmek için tıklayın<br><small style="color: #666;">(Birden fazla dosya seçebilirsiniz)</small></p>
        <input type="file" id="fileInput" accept=".csv,.txt" multiple style="display:none">
    </div>

    <!-- Yüklenen dosyaların görüneceği kavisli kareler -->
    <div class="file-list" id="fileList"></div>

    <!-- Hepsini tek seferde indirecek buton -->
    <button id="downloadAllBtn" class="btn">Hepsini İndir</button>

    <script>
        let processedFiles = [];

        // Bilimsel sayıları sütunları bozmayacak şekilde (saf metin olarak) dönüştüren fonksiyon
        function convertScientificNotation(text) {
            // Bilimsel gösterim desenini bulur (Örn: 5.992711e+002)
            const scientificRegex = /[-+]?[0-9]*\.?[0-9]+[eE][-+]?[0-9]+/g;
            
            return text.replace(scientificRegex, function(match) {
                const num = Number(match);
                if (!isNaN(num) && isFinite(num)) {
                    //toFixed(20) ile sayıyı noktadan sonra maksimum 20 basamağa açıyoruz
                    let fixedNum = num.toFixed(20);
                    
                    // Sayının sonundaki gereksiz sıfırları ve kalırsa noktayı temizliyoruz
                    if (fixedNum.indexOf('.') !== -1) {
                        fixedNum = fixedNum.replace(/\.?0+$/, "");
                    }
                    return fixedNum;
                }
                return match;
            });
        }

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const files = e.target.files;
            if (files.length === 0) return;

            const fileListContainer = document.getElementById('fileList');
            const downloadAllBtn = document.getElementById('downloadAllBtn');
            
            fileListContainer.innerHTML = "";
            processedFiles = [];

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                
                reader.onload = function(event) {
                    let content = event.target.result;

                    // 1. Adım: Bilimsel sayıları saf metin olarak genişlet (Araya hiç virgül karışmaz)
                    content = convertScientificNotation(content);

                    // 2. Adım: Karakter dönüşüm mantığı (; -> , ve , -> .)
                    content = content.replace(/,/g, '[TEMP_COMMA]');
                    content = content.replace(/;/g, ',');
                    content = content.replace(/\[TEMP_COMMA\]/g, '.');

                    // Dosya indirme URL'si oluşturma
                    const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const newFileName = "donusturulmus_" + file.name;

                    processedFiles.push({ url: url, name: newFileName });

                    // Arayüze kart ekleme
                    const card = document.createElement('div');
                    card.className = 'file-card';
                    card.innerHTML = `
                        <div class="file-icon">📄</div>
                        <div class="file-name" title="${file.name}">${file.name}</div>
                    `;
                    fileListContainer.appendChild(card);

                    if (processedFiles.length > 0) {
                        downloadAllBtn.style.display = 'inline-block';
                    }
                };
                
                reader.readAsText(file);
            });
        });

        // "Hepsini İndir" butonu tetikleyicisi
        document.getElementById('downloadAllBtn').addEventListener('click', function() {
            processedFiles.forEach((fileInfo, index) => {
                setTimeout(() => {
                    const a = document.createElement('a');
                    a.href = fileInfo.url;
                    a.download = fileInfo.name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                }, index * 250);
            });
        });
    </script>

</body>
</html>
